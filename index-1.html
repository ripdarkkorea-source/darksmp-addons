<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarkSMP — Addons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #0d0a16;
    --void-2: #16111f;
    --slot: #1e1830;
    --slot-border: #382a4f;
    --amethyst: #9b7fd4;
    --amethyst-glow: #b79cf0;
    --pearl: #5ce1c9;
    --bone: #e9e4f2;
    --bone-dim: #a89fbd;
    --danger: #ff6b5c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--void);
    color: var(--bone);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background-image:
      radial-gradient(circle at 20% 0%, rgba(155,127,212,0.10), transparent 45%),
      radial-gradient(circle at 90% 30%, rgba(92,225,201,0.06), transparent 40%);
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  header {
    padding: 44px 20px 28px;
    text-align: center;
    position: relative;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--pearl);
    margin: 0 0 10px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 8vw, 46px);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
    background: linear-gradient(180deg, #fff, var(--amethyst-glow));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p.sub {
    color: var(--bone-dim);
    font-size: 14.5px;
    max-width: 420px;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* ---------- Search ---------- */
  .search-wrap {
    max-width: 480px;
    margin: 28px auto 0;
    padding: 0 20px;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--void-2);
    border: 1px solid var(--slot-border);
    border-radius: 12px;
    padding: 13px 16px;
    transition: border-color .2s, box-shadow .2s;
  }

  .search-box:focus-within {
    border-color: var(--amethyst);
    box-shadow: 0 0 0 3px rgba(155,127,212,0.15);
  }

  .search-box svg { flex-shrink: 0; opacity: 0.6; }

  .search-box input {
    background: none;
    border: none;
    outline: none;
    color: var(--bone);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    width: 100%;
  }

  .search-box input::placeholder { color: var(--bone-dim); }

  .result-count {
    text-align: center;
    font-size: 12px;
    color: var(--bone-dim);
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ---------- Grid ---------- */
  .grid {
    max-width: 760px;
    margin: 26px auto 60px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--slot);
    border: 1px solid var(--slot-border);
    border-radius: 14px;
    padding: 14px 10px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    cursor: pointer;
    position: relative;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 14px;
    padding: 1px;
    background: linear-gradient(135deg, transparent, transparent);
    opacity: 0;
    transition: opacity .2s;
  }

  .card:active { transform: scale(0.96); }

  .card:hover, .card:focus-visible {
    border-color: var(--amethyst);
    box-shadow: 0 0 0 1px var(--amethyst) inset, 0 8px 20px -8px rgba(155,127,212,0.5);
    outline: none;
  }

  .card-icon {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    object-fit: cover;
    margin-bottom: 10px;
    background: var(--void);
    border: 1px solid var(--slot-border);
  }

  .card-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 13px;
    line-height: 1.25;
    color: var(--bone);
  }

  .card-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    color: var(--pearl);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 4px;
  }

  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 50px 20px;
    color: var(--bone-dim);
    font-size: 14px;
  }

  /* ---------- Detail sheet ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(6,4,10,0.7);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 10;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-width: 520px;
    margin: 0 auto;
    background: var(--void-2);
    border: 1px solid var(--slot-border);
    border-bottom: none;
    border-radius: 22px 22px 0 0;
    padding: 10px 22px 28px;
    transform: translateY(100%);
    transition: transform .28s cubic-bezier(.32,.72,0,1);
    z-index: 11;
    max-height: 86vh;
    overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }

  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--slot-border);
    border-radius: 4px;
    margin: 10px auto 18px;
  }

  .sheet-top {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .sheet-icon {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    object-fit: cover;
    border: 1px solid var(--slot-border);
    flex-shrink: 0;
  }

  .sheet-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 19px;
    margin: 0 0 4px;
  }

  .sheet-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--pearl);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .sheet-desc {
    margin: 20px 0 0;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--bone-dim);
  }

  .sheet-download {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    margin-top: 22px;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(180deg, var(--amethyst-glow), var(--amethyst));
    color: #1a1226;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 10px 24px -10px rgba(155,127,212,0.6);
    transition: filter .15s;
  }
  .sheet-download:active { filter: brightness(0.92); }

  .sheet-size {
    text-align: center;
    font-size: 11.5px;
    color: var(--bone-dim);
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
  }

  footer {
    text-align: center;
    padding: 20px;
    color: var(--bone-dim);
    font-size: 11.5px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
  }
</style>
</head>

    grid.innerHTML = '';
    if (list.length === 0) {
      grid.innerHTML = '<p class="empty">No addons found. Try a different keyword.</p>';
      resultCount.textContent = '';
      return;
    }
    resultCount.textContent = list.length + (list.length === 1 ? ' addon' : ' addons');
    list.forEach((addon, i) => {
      const card = document.createElement('button');
      card.className = 'card';
      card.setAttribute('aria-label', 'Open ' + addon.name);
      card.innerHTML = `
        <img class="card-icon" src="${addon.icon}" onerror="this.src='${FALLBACK_ICON}'" alt="">
        <span class="card-name">${addon.name}</span>
        <span class="card-tag">${addon.tag}</span>
      `;
      card.addEventListener('click', () => openSheet(addon));
      grid.appendChild(card);
    });
  }

  function openSheet(addon) {
    document.getElementById('sheetIcon').src = addon.icon;
    document.getElementById('sheetIcon').onerror = function(){ this.src = FALLBACK_ICON; };
    document.getElementById('sheetTag').textContent = addon.tag;
    document.getElementById('sheetTitle').textContent = addon.name;
    document.getElementById('sheetDesc').textContent = addon.description;
    document.getElementById('sheetDownload').href = addon.download;
    document.getElementById('sheetSize').textContent = addon.size ? ('File size: ' + addon.size) : '';
    overlay.classList.add('open');
    sheet.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeSheet() {
    overlay.classList.remove('open');
    sheet.classList.remove('open');
    document.body.style.overflow = '';
  }

  overlay.addEventListener('click', closeSheet);

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = addons.filter(a =>
      a.name.toLowerCase().includes(q) ||
      a.tag.toLowerCase().includes(q) ||
      a.description.toLowerCase().includes(q)
    );
    renderGrid(filtered);
  });

  renderGrid(addons);
</script>

</body>
</html>
